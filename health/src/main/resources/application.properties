# Database (Render: DB_URL must be jdbc:postgresql://HOST:5432/DB)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthdb}
spring.datasource.username=${DB_USERNAME:bhavyamanocha}
spring.datasource.password=${DB_PASSWORD:12345678}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Server (Render injects PORT)
server.port=${PORT:8081}

# Groq AI
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}

# Brevo Email
brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:}
brevo.from.name=${BREVO_FROM_NAME:Healthcare App}

# Google Calendar
google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:true}
google.calendar.credentials.path=${GOOGLE_CALENDAR_CREDENTIALS_PATH:src/main/resources/credentials.json}
google.calendar.tokens.path=${GOOGLE_CALENDAR_TOKENS_PATH:tokens}
google.calendar.id=${GOOGLE_CALENDAR_ID:primary}
