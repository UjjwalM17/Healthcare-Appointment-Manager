# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthdb}
spring.datasource.username=${DB_USERNAME:bhavyamanocha}
spring.datasource.password=${DB_PASSWORD:12345678}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=${PORT:8081}

# Groq AI
groq.api.key=${GROQ_API_KEY:YOUR_GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# Brevo Email
brevo.api.key=${BREVO_API_KEY:YOUR_BREVO_API_KEY}
brevo.from.email=${BREVO_FROM_EMAIL:YOUR_VERIFIED_EMAIL}
brevo.from.name=Healthcare App

# Google Calendar
google.calendar.credentials.path=src/main/resources/credentials.json
google.calendar.tokens.path=tokens